<div class="mod-header-triptych" data-diagram-module="header-triptych">
  <style>
    .mod-header-triptych { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0.75rem; max-width: 100%; }
    .mod-header-triptych .hdr { border: 1px solid #c9c2b4; border-radius: 0.4rem; padding: 0.6rem; text-align: center; }
    .mod-header-triptych .k { display: block; font-size: 0.8rem; color: #5c574e; }
    .mod-header-triptych .v { display: block; font-size: 1.4rem; font-weight: 700; }
    @media (max-width: 40rem) {
      .mod-header-triptych { grid-template-columns: 1fr; }
    }
  </style>
  <div class="hdr"><span class="k">ptr</span><span class="v">{{PTR}}</span></div>
  <div class="hdr"><span class="k">len</span><span class="v">{{LEN}}</span></div>
  <div class="hdr"><span class="k">cap</span><span class="v">{{CAP}}</span></div>
</div>
