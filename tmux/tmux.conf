
##### -------------------------------------------------------
#####  Terminal + Core Options
##### -------------------------------------------------------

set -g default-terminal "${TERM}"
set -g mouse on
setw -g mode-keys vi

##### -------------------------------------------------------
#####  Reload Config
##### -------------------------------------------------------

bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded!"

##### -------------------------------------------------------
#####  Splits + Pane Controls
##### -------------------------------------------------------

unbind '"'
unbind %

bind | split-window -h
bind - split-window -v

bind-key q kill-pane

bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r h resize-pane -L 5
bind -r l resize-pane -R 5

bind -r m resize-pane -Z

##### -------------------------------------------------------
#####  Sessions
##### -------------------------------------------------------

bind S command-prompt -p "New session name:" "new-session -s '%%'"
bind K confirm-before -p "Kill session #S? (y/n)" kill-session

##### -------------------------------------------------------
#####  Copy Mode
##### -------------------------------------------------------

bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-selection
unbind -T copy-mode-vi MouseDragEnd1Pane

##### -------------------------------------------------------
#####  TPM + Plugins
##### -------------------------------------------------------

set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.config/tmux/plugins"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'jimeh/tmux-themepack'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

##### -------------------------------------------------------
#####  Themepack Settings (Your Existing Theme)
##### -------------------------------------------------------

set -g @themepack 'powerline/double/cyan'

# hard-coded values (same as your original)
set -goq @themepack-status-left-area-middle-format "BatmanNLT"
set -goq @themepack-status-right-area-right-format "  BatComputer"

set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'

##### -------------------------------------------------------
#####  TPM Init (must remain last)
##### -------------------------------------------------------

run '~/.config/tmux/plugins/tpm/tpm'
