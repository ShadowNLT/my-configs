
##### -------------------------------------------------------
#####  Terminal + Core Options
##### -------------------------------------------------------

set -g default-terminal "tmux-256color"
set -as terminal-features ",ghostty:RGB"
set -g mouse on
setw -g mode-keys vi

##### -------------------------------------------------------
#####  Reload Config
##### -------------------------------------------------------

bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded!"

##### -------------------------------------------------------
#####  Splits + Pane Controls
##### -------------------------------------------------------

unbind '"'
unbind %

bind | split-window -h
bind - split-window -v

bind-key q kill-pane

bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r h resize-pane -L 5
bind -r l resize-pane -R 5

bind -r m resize-pane -Z

##### -------------------------------------------------------
#####  Sessions
##### -------------------------------------------------------

bind S command-prompt -p "New session name:" "new-session -s '%%'"
bind K confirm-before -p "Kill session #S? (y/n)" kill-session

##### -------------------------------------------------------
#####  Copy Mode
##### -------------------------------------------------------

bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-selection
unbind -T copy-mode-vi MouseDragEnd1Pane

##### -------------------------------------------------------
#####  TPM + Plugins
##### -------------------------------------------------------

set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.config/tmux/plugins"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'

##### -------------------------------------------------------
#####  Theme — Cyberdream (craftzdog-style powerline)
##### -------------------------------------------------------
#
#  Layout:  [ session ]   window  window  …                     [ clock ][ host ]
#  Angled separators use Nerd Font powerline arrows ( left,  right).
#  Active window = warm orange (craftzdog accent); inactive = faint slate.

set -g status on
set -g status-position bottom
set -g status-justify left
set -g status-style                "bg=#1e2030,fg=#7b8496"
set -g status-left-length  60
set -g status-right-length 60

# Left: session segment (cyan) with a right-arrow slant () into the bar
set -g status-left "#[fg=#1e2030,bg=#5ef1ff,bold] #S #[fg=#5ef1ff,bg=#232a3f]#[fg=#ffffff,bg=#232a3f] BatmanNLT #[fg=#232a3f,bg=#1e2030] "

# Right: clock then host segments, each entered by a left-arrow slant ()
set -g status-right "#[fg=#232a3f,bg=#1e2030]#[fg=#ffffff,bg=#232a3f] %H:%M #[fg=#5ef1ff,bg=#232a3f]#[fg=#1e2030,bg=#5ef1ff,bold] BatComputer "

# Window list — each window a segment with a trailing right-arrow (); active = warm orange
setw -g window-status-separator      ""
setw -g window-status-format         "#[fg=#7b8496,bg=#232a3f] #I #W #[fg=#232a3f,bg=#1e2030]"
setw -g window-status-current-format "#[fg=#1e2030,bg=#ffbd5e,bold] #I #W #[fg=#ffbd5e,bg=#1e2030]"

# Pane background (matches Cyberdream bg)
set -g window-style        "bg=#1e2030"
set -g window-active-style "bg=#1e2030"

# Pane borders
set -g pane-border-style        "fg=#3c4048"
set -g pane-active-border-style "fg=#5ef1ff"

# Message / command bar
set -g message-style         "bg=#232a3f,fg=#ffffff"
set -g message-command-style "bg=#232a3f,fg=#ffffff"

# Selection highlight (choose-tree, copy mode)
set -g mode-style "bg=#5ef1ff,fg=#1e2030,bold"

##### -------------------------------------------------------
#####  TPM Init (must remain last)
##### -------------------------------------------------------

run '~/.config/tmux/plugins/tpm/tpm'
