<div class="mod-timeline" data-diagram-module="timeline">
  <style>
    .mod-timeline { max-width: 100%; }
    .mod-timeline svg { width: 100%; height: auto; display: block; }
    .mod-timeline .dur { font-size: 0.8rem; color: #5c574e; margin: 0.35rem 0 0; }
  </style>
  <svg viewBox="0 0 320 110" role="img" aria-label="events on a duration axis">
    <line x1="20" y1="64" x2="300" y2="64" stroke="#1c1c1c" stroke-width="2"/>
    <polygon points="300,64 290,59 290,69" fill="#1c1c1c"/>
    <text x="20" y="84" font-size="11" fill="#5c574e">{{T0}}</text>
    <text x="300" y="84" text-anchor="end" font-size="11" fill="#5c574e">{{TN}}</text>
    <line x1="48" y1="56" x2="48" y2="72" stroke="#215c45" stroke-width="3"/>
    <text x="48" y="28" text-anchor="middle" font-size="12" font-weight="700">{{E1}}</text>
    <text x="48" y="44" text-anchor="middle" font-size="10" fill="#5c574e">{{T1}}</text>
    <line x1="140" y1="56" x2="140" y2="72" stroke="#215c45" stroke-width="3"/>
    <text x="140" y="28" text-anchor="middle" font-size="12" font-weight="700">{{E2}}</text>
    <text x="140" y="44" text-anchor="middle" font-size="10" fill="#5c574e">{{T2}}</text>
    <line x1="248" y1="56" x2="248" y2="72" stroke="#215c45" stroke-width="3"/>
    <text x="248" y="28" text-anchor="middle" font-size="12" font-weight="700">{{E3}}</text>
    <text x="248" y="44" text-anchor="middle" font-size="10" fill="#5c574e">{{T3}}</text>
    <line x1="48" y1="96" x2="248" y2="96" stroke="#215c45" stroke-width="2"/>
    <line x1="48" y1="90" x2="48" y2="102" stroke="#215c45" stroke-width="2"/>
    <line x1="248" y1="90" x2="248" y2="102" stroke="#215c45" stroke-width="2"/>
  </svg>
  <p class="dur">duration {{SPAN}}</p>
</div>
