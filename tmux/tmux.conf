
##### -------------------------------------------------------
#####  Terminal + Core Options
##### -------------------------------------------------------

set -g default-terminal "tmux-256color"
set -as terminal-features ",ghostty:RGB"
set -g mouse on
setw -g mode-keys vi

##### -------------------------------------------------------
#####  Reload Config
##### -------------------------------------------------------

bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded!"

##### -------------------------------------------------------
#####  Splits + Pane Controls
##### -------------------------------------------------------

unbind '"'
unbind %

bind | split-window -h
bind - split-window -v

bind-key q kill-pane

bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r h resize-pane -L 5
bind -r l resize-pane -R 5

bind -r m resize-pane -Z

##### -------------------------------------------------------
#####  Sessions
##### -------------------------------------------------------

bind S command-prompt -p "New session name:" "new-session -s '%%'"
bind K confirm-before -p "Kill session #S? (y/n)" kill-session

##### -------------------------------------------------------
#####  Copy Mode
##### -------------------------------------------------------

bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-selection
unbind -T copy-mode-vi MouseDragEnd1Pane

##### -------------------------------------------------------
#####  TPM + Plugins
##### -------------------------------------------------------

set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.config/tmux/plugins"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'

##### -------------------------------------------------------
#####  Theme — Everforest Hard Dark
##### -------------------------------------------------------

set -g status on
set -g status-position bottom
set -g status-justify centre
set -g status-style                "bg=#1e2326,fg=#d3c6aa"
set -g status-left-length  60
set -g status-right-length 60

# Left: [green: session] > [bg1: BatmanNLT] > [bg0: window:pane]
set -g status-left "#[fg=#1e2326,bg=#a7c080,bold] #S #[fg=#a7c080,bg=#272e33]#[fg=#d3c6aa,bg=#272e33] BatmanNLT #[fg=#272e33,bg=#1e2326]#[fg=#859289,bg=#1e2326] #I:#P "

# Right: [bg0: time] > [bg1: date] > [green: BatComputer]
set -g status-right "#[fg=#272e33,bg=#1e2326]#[fg=#d3c6aa,bg=#272e33] %H:%M #[fg=#a7c080,bg=#272e33]#[fg=#1e2326,bg=#a7c080,bold]  BatComputer "

# Window list
setw -g window-status-style         "fg=#859289,bg=#1e2326"
setw -g window-status-current-style "fg=#a7c080,bg=#2e383c,bold"
setw -g window-status-format        " #I:#W "
setw -g window-status-current-format " #I:#W "
setw -g window-status-separator      ""

# Pane background (matches Everforest hard dark bg)
set -g window-style        "bg=#1e2326"
set -g window-active-style "bg=#1e2326"

# Pane borders
set -g pane-border-style        "fg=#3d484d"
set -g pane-active-border-style "fg=#a7c080"

# Message / command bar
set -g message-style         "bg=#272e33,fg=#d3c6aa"
set -g message-command-style "bg=#272e33,fg=#d3c6aa"

# Selection highlight (choose-tree, copy mode)
set -g mode-style "bg=#a7c080,fg=#1e2326,bold"

##### -------------------------------------------------------
#####  TPM Init (must remain last)
##### -------------------------------------------------------

run '~/.config/tmux/plugins/tpm/tpm'
