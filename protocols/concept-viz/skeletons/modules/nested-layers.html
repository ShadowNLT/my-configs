<div class="mod-nested-layers" data-diagram-module="nested-layers">
  <style>
    .mod-nested-layers { padding: 0.5rem; max-width: 100%; }
    .mod-nested-layers .outer { border: 2px solid #1c1c1c; padding: 0.75rem; }
    .mod-nested-layers .mid { border: 2px dashed #215c45; padding: 0.75rem; margin-top: 0.4rem; }
    .mod-nested-layers .inner { border: 2px solid #215c45; background: #e8f2ed; padding: 0.75rem; margin-top: 0.4rem; }
    .mod-nested-layers .lab { font-size: 0.8rem; color: #5c574e; }
  </style>
  <div class="outer">
    <div class="lab">{{OUTER}}</div>
    <div class="mid">
      <div class="lab">{{MID}}</div>
      <div class="inner">{{INNER}}</div>
    </div>
  </div>
</div>
