<div class="mod-common-scale-bars" data-diagram-module="common-scale-bars">
  <style>
    .mod-common-scale-bars { display: flex; flex-direction: column; gap: 0.6rem; max-width: 100%; }
    .mod-common-scale-bars .row { display: grid; grid-template-columns: 5.5rem 1fr 2.2rem; gap: 0.4rem; align-items: center; }
    .mod-common-scale-bars .name { font-size: 0.85rem; }
    .mod-common-scale-bars .track { background: #f3efe6; border: 1px solid #c9c2b4; height: 1.35rem; }
    .mod-common-scale-bars .bar { height: 100%; background: #215c45; }
    .mod-common-scale-bars .n { font-weight: 700; font-variant-numeric: tabular-nums; }
    .mod-common-scale-bars .axis { display: grid; grid-template-columns: 5.5rem 1fr 2.2rem; gap: 0.4rem; font-size: 0.75rem; color: #5c574e; }
    .mod-common-scale-bars .ticks { display: flex; justify-content: space-between; border-top: 1px solid #1c1c1c; padding-top: 0.15rem; }
    @media (max-width: 40rem) {
      .mod-common-scale-bars .row, .mod-common-scale-bars .axis { grid-template-columns: 4.2rem 1fr 1.8rem; }
    }
  </style>
  <div class="row">
    <div class="name">{{A_NAME}}</div>
    <div class="track" role="img" aria-label="{{A_NAME}} length {{A_VAL}} of {{SCALE}}">
      <div class="bar" style="width: 20%"></div>
    </div>
    <div class="n">{{A_VAL}}</div>
  </div>
  <div class="row">
    <div class="name">{{B_NAME}}</div>
    <div class="track" role="img" aria-label="{{B_NAME}} length {{B_VAL}} of {{SCALE}}">
      <div class="bar" style="width: 50%"></div>
    </div>
    <div class="n">{{B_VAL}}</div>
  </div>
  <div class="row">
    <div class="name">{{C_NAME}}</div>
    <div class="track" role="img" aria-label="{{C_NAME}} length {{C_VAL}} of {{SCALE}}">
      <div class="bar" style="width: 80%"></div>
    </div>
    <div class="n">{{C_VAL}}</div>
  </div>
  <div class="axis">
    <span></span>
    <div class="ticks"><span>0</span><span>{{SCALE}}</span></div>
    <span></span>
  </div>
</div>
