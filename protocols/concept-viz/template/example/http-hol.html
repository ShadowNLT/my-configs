<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>concept-viz</title>
<style>
:root{
  --bg:#0b0e12; --panel:#12171e; --panel2:#161c24; --line:#212a35; --line2:#2c3846;
  --ink:#e2e8f2; --faint:#78849a; --dim:#3b4553;
  --hs:#7c8698; --req:#4dd0e1; --wait:#333d4b;
  --block:#e8544d; --stall:#ff5a52; --lost:#ff8f3d; --rtx:#ffcc33; --ok:#5fd07a;
  --s0:#4fc3f7; --s1:#8bc34a; --s2:#ffb74d; --s3:#ba68c8;
  --s4:#f06292; --s5:#fff176; --s6:#4db6ac;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,system-ui,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
  -webkit-font-smoothing:antialiased;display:flex;justify-content:center;
  padding:24px 20px 104px}
.app{width:100%;max-width:1300px}
header{display:flex;align-items:flex-start;justify-content:space-between;gap:24px}
.chip{display:inline-block;font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--req);border:1px solid #1d3a42;background:#0f2027;
  padding:4px 9px;border-radius:5px;margin-bottom:11px}
h1{font-size:26px;line-height:1.24;margin:0 0 6px;font-weight:600;letter-spacing:-.015em}
h1 em{font-style:normal;color:var(--faint);font-weight:400}
.sub{color:var(--faint);font-size:14px;max-width:74ch;line-height:1.5}
.count{font-family:var(--mono);font-size:12px;color:var(--dim);white-space:nowrap;padding-top:4px}
.count b{color:var(--ink);font-weight:500}
.dots{display:flex;gap:5px;margin:18px 0 18px}
.dot{height:3px;flex:1;background:var(--line);border-radius:2px;overflow:hidden;cursor:pointer}
.dot i{display:block;height:100%;width:0;background:var(--req);border-radius:2px}
.dot.done i{width:100%;background:var(--dim)}
.stats{display:flex;gap:0;margin-bottom:15px;font-family:var(--mono);
  border:1px solid var(--line);border-radius:10px;overflow:hidden}
.stat{padding:10px 18px;flex:0 0 auto;border-right:1px solid var(--line);min-width:132px}
.stat:last-child{border-right:0}
.stat b{display:block;font-size:23px;font-weight:500;letter-spacing:-.02em;line-height:1.15;
  font-variant-numeric:tabular-nums}
.stat span{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.stat.bad b{color:var(--block)} .stat.good b{color:var(--ok)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:13px;
  padding:15px 16px;transition:opacity .28s;display:flex;gap:16px;align-items:stretch}
#chartcol{flex:1;min-width:0}
.panel.swap{opacity:0}
svg{display:block;width:100%;height:auto;overflow:visible}
.lbl{font-family:var(--mono);font-size:11.5px;fill:var(--faint)}
.st{font-family:var(--mono);font-size:10.5px;fill:var(--dim)}
.axl{font-family:var(--mono);font-size:9.5px;fill:var(--dim)}
.anl{font-family:var(--sans);font-size:11px;font-weight:500}
.stall-r{animation:pulse .68s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.glyph{font-family:var(--mono);font-size:14px;font-weight:700;text-anchor:middle}
#drain{display:none;margin-top:15px;font-family:var(--mono);font-size:10.5px;color:var(--faint)}
#drain .cells{display:flex;gap:2.5px;margin-bottom:8px}
#drain i{width:12px;height:12px;border-radius:2.5px;background:var(--block);opacity:.3;
  transition:background .25s,opacity .25s}
#drain i.f{background:var(--s0);opacity:1} #drain i.d{background:#2c6b39;opacity:.9}
.notes{margin-top:17px;min-height:96px}
.note{font-size:14.5px;line-height:1.55;opacity:0;transform:translateY(6px);
  transition:opacity .4s,transform .4s;margin-bottom:3px;color:var(--ink)}
.note.on{opacity:.9;transform:none}
.note.key{color:#ffd6d2}
.legend{flex:0 0 152px;display:flex;flex-direction:column;gap:9px;font-family:var(--mono);
  font-size:10.5px;color:var(--faint);border-left:1px solid var(--line);padding-left:15px}
.legend h4{margin:0 0 3px;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--dim);font-weight:500}
.legend span{display:flex;align-items:center;line-height:1.35}
.legend b{width:15px;height:9px;border-radius:2px;margin-right:9px;flex:0 0 auto}
#summary{display:none}
.row{display:grid;grid-template-columns:104px 1fr 82px;align-items:center;gap:14px;margin-bottom:10px}
.row .nm{font-family:var(--mono);font-size:12.5px}
.row .nm i{display:block;font-style:normal;font-size:10.5px;color:var(--faint);margin-top:2px}
.row .track{height:20px;background:#0f141a;border-radius:5px;overflow:hidden;
  border:1px solid var(--line)}
.row .track i{display:block;height:100%;width:0;border-radius:4px;
  transition:width .45s cubic-bezier(.22,1,.36,1)}
.row .ms{font-family:var(--mono);font-size:12.5px;text-align:right;
  font-variant-numeric:tabular-nums;color:var(--faint)}
.takeaways{margin-top:24px;border-top:1px solid var(--line);padding-top:18px}
.tk{display:grid;grid-template-columns:132px 1fr;gap:14px;font-size:13.5px;margin-bottom:10px;
  opacity:0;transform:translateY(6px);transition:opacity .45s,transform .45s}
.tk.on{opacity:1;transform:none}
.tk b{font-family:var(--mono);font-size:12px;color:var(--ok);font-weight:500}
.tk.warn b{color:var(--lost)}
.foot{margin-top:20px;font-size:11.5px;color:var(--dim);line-height:1.65;font-family:var(--mono)}
.bar{position:fixed;left:0;right:0;bottom:0;background:rgba(11,14,18,.94);
  backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:10px 20px 8px;
  display:flex;flex-direction:column;align-items:center;gap:7px}
.bar .r1{display:flex;gap:11px;align-items:center}
button{background:#1a212a;color:var(--ink);border:1px solid var(--line2);border-radius:7px;
  padding:6px 13px;font-family:var(--mono);font-size:12px;cursor:pointer;min-width:44px}
button:hover:not(:disabled){background:#222c37}
button:disabled{opacity:.3;cursor:not-allowed}
#play{min-width:74px;background:#20303a;border-color:#2b4652}
#scrub{width:260px;accent-color:var(--req)}
.slab{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--faint)}
#spd{width:210px;accent-color:var(--s1)}
#spdv{font-family:var(--mono);font-size:12px;min-width:112px;text-align:left;
  font-variant-numeric:tabular-nums;color:var(--ink)}
#spdv i{font-style:normal;color:var(--dim)}
.presets{display:flex;gap:5px}
.presets button{min-width:0;padding:4px 8px;font-size:11px}
.presets button.on{background:#20303a;border-color:#2b4652;color:var(--req)}
.keys{font-family:var(--mono);font-size:10px;color:var(--dim);letter-spacing:.02em}
.keys b{color:var(--faint);font-weight:500}
</style></head><body>
<div class="app">
  <header>
    <div>
      <div class="chip" id="chip"></div>
      <h1 id="title"></h1>
      <div class="sub" id="sub"></div>
    </div>
    <div class="count">scene <b id="scn">1</b> / <span id="tot"></span></div>
  </header>
  <div class="dots" id="dots"></div>
  <div class="stats" id="stats"></div>
  <div class="panel" id="panel">
    <div id="chartcol"><svg id="chart"></svg><div id="drain"></div></div>
    <aside class="legend" id="legend"></aside>
  </div>
  <div id="summary"></div>
  <div class="notes" id="notes"></div>
</div>
<div class="bar">
  <div class="r1">
    <button id="rall" title="restart the whole thing from scene 1 (shift+R)">⏮</button>
    <button id="rscene" title="replay this scene from its start (r)">⟲</button>
    <button id="prev" title="previous scene">◀</button>
    <button id="play">pause</button>
    <button id="next" title="next scene">▶</button>
    <input type="range" id="scrub" min="0" max="100" value="0" title="scrub this scene">
  </div>
  <div class="r1">
    <span class="slab">speed</span>
    <input type="range" id="spd" min="-432" max="300" step="4" value="-200">
    <span id="spdv"></span>
    <span class="presets" id="presets"></span>
  </div>
  <div class="keys"><b>space</b> play/pause · <b>← →</b> step one tick · <b>[ ]</b> scene ·
    <b>j l</b> slower/faster · <b>r</b> replay scene · <b>shift+R</b> restart all ·
    <b>0</b> jump to start</div>
</div>
<script>

/* =================================================================== MODEL
   One bottleneck link: exactly one response packet is delivered per tick,
   shared round-robin by every job with bytes ready. Handshakes and requests
   cost lane time but no link time. Every number on screen comes from here. */
const TICK_MS=20, RTT=2, TW=64, RECOVER=4;
const ASSETS=[
  {name:'index.html',wait:2,packets:2},{name:'style.css',wait:1,packets:2},
  {name:'hero.jpg',  wait:3,packets:8},{name:'app.js',   wait:1,packets:3},
  {name:'logo.png',  wait:1,packets:2},{name:'api.json', wait:2,packets:2},
  {name:'font.woff2',wait:1,packets:3}];

function J(a,lane,hs,prereq,after){return{a,lane,hs:hs||0,prereq:prereq||null,after:after||null,
  discovered:0,start:null,req_t:null,ready:null,left:a.packets,done:null};}

function simulate(jobs,loss){
  jobs.forEach(j=>{j.start=null;j.req_t=null;j.ready=null;j.left=j.a.packets;j.done=null;});
  const lanes={},wire=new Array(TW).fill(null);
  jobs.forEach(j=>{if(!lanes[j.lane])lanes[j.lane]=new Array(TW).fill(null);});
  const put=(c,s,n,k)=>{for(let i=Math.max(0,s);i<Math.min(s+n,TW);i++)c[i]={k};};
  let rr=0,stallEnd=0,fired=false,held=[],lostAt=-1,rtxAt=-1;
  for(let t=0;t<TW;t++){
    for(const j of jobs){
      if(j.start!==null)continue;
      let disc=j.discovered;
      if(j.after){ if(j.after.done===null)continue; disc=Math.max(disc,j.after.done); }
      if(t<disc)continue;
      if(j.prereq&&(j.prereq.done===null||j.prereq.done>t))continue;
      j.start=t; j.req_t=t+j.hs; j.ready=j.req_t+1+j.a.wait;
      const c=lanes[j.lane];
      put(c,t,j.hs,'hs'); put(c,j.req_t,1,'req'); put(c,j.req_t+1,j.a.wait,'wait');
    }
    for(const j of jobs){
      let disc=j.discovered;
      if(j.after){ if(j.after.done===null)continue; disc=Math.max(disc,j.after.done); }
      if(disc<=t&&(j.start===null||t<j.start)&&lanes[j.lane][t]===null)
        lanes[j.lane][t]={k:'block'};
    }
    if(held.length&&t===stallEnd){
      wire[t]={k:'rtx'}; rtxAt=t;
      for(const j of held){ j.left--; if(j.left===0)j.done=t; lanes[j.lane][t]={k:'burst',lane:j.lane}; }
      held=[];
      for(const j of jobs) if(j.left>0&&j.ready!==null&&j.ready<=t&&lanes[j.lane][t]===null)
        lanes[j.lane][t]={k:'wait'};
      continue;
    }
    const stalling=t<stallEnd;
    const frozenLane=(stalling&&loss&&loss.stream!=null)?loss.stream:-1;
    const frozenAll=stalling&&frozenLane<0;
    let pick=-1;
    for(let k=0;k<jobs.length;k++){
      const i=(rr+k)%jobs.length, j=jobs[i];
      if(j.left>0&&j.ready!==null&&j.ready<=t){
        if(frozenLane>=0&&j.lane===frozenLane)continue;
        pick=i;break;
      }
    }
    for(const j of jobs)
      if(j.left>0&&j.ready!==null&&j.ready<=t&&lanes[j.lane][t]===null)
        lanes[j.lane][t]={k:(stalling&&(frozenAll||j.lane===frozenLane))?'stall':'wait'};
    if(pick<0)continue;
    rr=pick+1; const j=jobs[pick];
    if(loss&&!fired&&t>=loss.tick&&(loss.stream==null||j.lane===loss.stream)){
      wire[t]={k:'lost'}; stallEnd=t+RECOVER; fired=true; lostAt=t; continue;
    }
    if(stalling&&(frozenAll||j.lane===frozenLane)){
      wire[t]={k:'held',lane:j.lane}; held.push(j); lanes[j.lane][t]={k:'stall'};
    }else{
      wire[t]={k:'pkt',lane:j.lane}; lanes[j.lane][t]={k:'resp',lane:j.lane};
      j.left--; if(j.left===0)j.done=t+1;
    }
  }
  const fin=Math.max(...jobs.filter(j=>j.done!==null).map(j=>j.done),0)||TW;
  return {lanes,wire,fin,lostAt,rtxAt};
}

/* =============================================================== SCENES
   anno kinds:  point {lane,tick,text,dir}      arrow onto one cell
                span  {lane,from,to,text,live}  measured bracket under a lane
                band  {from,to,text}            vertical region across all lanes  */
function h10(){
  const jobs=ASSETS.map((a,i)=>J(a,i,RTT));
  for(let i=1;i<jobs.length;i++){jobs[i].prereq=jobs[i-1];jobs[i].after=jobs[0];}
  const r=simulate(jobs);
  return{proto:'HTTP/1.0',title:'A fresh connection for <em>every single file</em>',
    sub:'One row per asset. Open a connection, fetch one thing, close it, start over.',
    lanes:ASSETS.map((a,i)=>[a.name,r.lanes[i]]),fin:r.fin,jobs,
    anno:[
      {at:2,kind:'point',lane:0,tick:0,dir:'up',text:'a whole round trip before it can even ask',color:'--hs'},
      {at:jobs[2].start,kind:'span',lane:2,from:jobs[0].done,to:jobs[2].start,live:true,
       text:'hero.jpg waiting its turn',color:'--block'},
      {at:jobs[4].start-3,kind:'point',lane:4,tick:jobs[4].start,dir:'down',
       text:'handshake #5 — nothing here is reused',color:'--hs'},
      {at:jobs[6].start,kind:'span',lane:6,from:jobs[0].done,to:jobs[6].start,live:true,
       text:'font.woff2 blocked',color:'--block'}],
    notes:[[1,'Each row is one asset, and each gets its own connection.'],
      [8,'HTTP/1.0 closes that connection after the response, so the next asset starts from zero — a fresh handshake, a fresh round trip.'],
      [26,'Seven assets, seven handshakes, nothing overlapping. The hatched red is time an asset is known about but not yet allowed to begin.',1]]};
}
function h11(){
  const jobs=ASSETS.map((a,i)=>J(a,i,i===0?RTT:0));
  for(let i=1;i<jobs.length;i++){jobs[i].prereq=jobs[i-1];jobs[i].after=jobs[0];}
  const r=simulate(jobs);
  const hero=jobs[2],font=jobs[6];
  return{proto:'HTTP/1.1 keep-alive',title:'One connection, reused — and <em>strictly in order</em>',
    sub:'The handshake is paid once. But a connection carries exactly one request at a time.',
    lanes:ASSETS.map((a,i)=>[a.name,r.lanes[i]]),fin:r.fin,jobs,
    anno:[
      {at:1,kind:'point',lane:0,tick:0,dir:'up',text:'handshake — paid once, then kept open',color:'--req'},
      {at:hero.start+1,kind:'point',lane:2,tick:hero.req_t+1,dir:'up',
       text:'server still generating hero.jpg',color:'--wait2'},
      {at:hero.start,kind:'band',from:hero.start,to:hero.done,live:true,
       text:'the connection is busy — nobody else may speak',color:'--block'},
      {at:jobs[0].done+1,kind:'span',lane:6,from:jobs[0].done,to:font.start,live:true,
       text:'font.woff2 blocked',color:'--block'},
      {at:font.start,kind:'point',lane:6,tick:font.req_t,dir:'down',
       text:'…finally allowed to ask',color:'--req'}],
    notes:[[2,'The connection stays open now, so the handshake is paid once. Better.'],
      [11,'But hero.jpg is slow to generate, and one connection carries one request at a time…'],
      [15,'…so every hatched bar below it is a request the client is not allowed to send yet.',1],
      [24,'That is head-of-line blocking: the whole line moves at the pace of its slowest member.',1],
      [33,'Pipelining let you send ahead, but responses still had to come back in order — and proxies mangled it, so browsers shipped with it off.']]};
}
function par(){
  const idx=J(ASSETS[0],0,RTT), st=J(ASSETS[1],0,0,idx,idx);
  const jobs=[idx,st].concat(ASSETS.slice(2).map((a,k)=>J(a,k+1,RTT,null,idx)));
  const r=simulate(jobs);
  return{proto:'HTTP/1.1 × 6',title:'The workaround: <em>just open more connections</em>',
    sub:'Chrome and Firefox open up to six TCP connections per origin. Each row is a connection.',
    lanes:[0,1,2,3,4,5].map(i=>['conn '+(i+1),r.lanes[i]]),fin:r.fin,drain:true,jobs,
    anno:[
      {at:idx.done,kind:'band',from:idx.done,to:idx.done+RTT,
       text:'six handshakes at once',color:'--hs'},
      {at:idx.done+RTT+2,kind:'point',lane:1,tick:jobs[2].ready+1,dir:'up',
       text:'hero.jpg is still slowest — but now it only blocks its own line',color:'--s2'},
      {at:idx.done+4,kind:'span',lane:5,from:idx.done+RTT,to:r.fin,
       text:'six connections, one shared link — no extra bandwidth',color:'--faint'}],
    notes:[[2,'Six lines instead of one, so a slow asset only holds up its own connection.'],
      [10,'But that is six handshakes, and the six share one bottleneck link — nobody actually gained bandwidth.'],
      [16,'And the cap bites. On a real page, everything past the sixth asset queues for a free connection.',1]]};
}
function muxJobs(){
  const idx=J(ASSETS[0],0,RTT);
  return [idx].concat(ASSETS.slice(1).map((a,k)=>J(a,k+1,0,null,idx)));
}
function h2(loss){
  const jobs=muxJobs(), r=simulate(jobs,loss);
  return{proto:'HTTP/2',title:'Seven streams on one connection — <em>until a packet drops</em>',
    sub:'The bottom row is the single TCP connection, coloured by which stream each packet carries.',
    lanes:ASSETS.map((a,i)=>[a.name,r.lanes[i]]),wire:['TCP wire',r.wire],fin:r.fin,jobs,
    anno:[
      {at:jobs[1].req_t,kind:'point',lane:1,tick:jobs[1].req_t,dir:'up',
       text:'all seven requests go out at once',color:'--req'},
      {at:r.lostAt,until:r.rtxAt,kind:'point',wire:true,tick:r.lostAt,dir:'down',
       text:'one packet dropped',color:'--lost'},
      {at:r.lostAt+1,kind:'band',from:r.lostAt,to:r.rtxAt,live:true,
       text:'every stream stalls — TCP delivers in order or not at all',color:'--stall'},
      {at:r.rtxAt,kind:'point',wire:true,tick:r.rtxAt,dir:'down',
       text:'retransmit lands — everything releases at once',color:'--rtx'}],
    notes:[[7,'All seven requests go out together and the responses interleave. That is multiplexing.'],
      [11,'No HTTP-level head-of-line blocking any more: hero.jpg holds up nobody.'],
      [r.lostAt+1,'✗ — one packet is lost, and TCP is a single ordered byte stream.',1],
      [r.lostAt+2,'The bytes keep arriving, but the kernel may not hand any of them up out of order — so all seven stall at once.',1],
      [r.rtxAt+2,'Head-of-line blocking is back, one layer down, in the transport.']]};
}
function h3(loss){
  const jobs=muxJobs(), r=simulate(jobs,loss);
  return{proto:'HTTP/3 over QUIC',title:'Same loss — but the streams are <em>independent</em>',
    sub:'QUIC runs on UDP and orders bytes per stream, not per connection.',
    lanes:ASSETS.map((a,i)=>[a.name,r.lanes[i]]),wire:['UDP wire',r.wire],fin:r.fin,jobs,
    anno:[
      {at:r.lostAt,kind:'point',wire:true,tick:r.lostAt,dir:'down',
       text:'the identical loss, same moment',color:'--lost'},
      {at:r.lostAt+1,kind:'span',lane:2,from:r.lostAt,to:r.lostAt+RECOVER,
       text:'only hero.jpg waits',color:'--stall'},
      {at:r.lostAt+2,kind:'point',lane:4,tick:r.lostAt+2,dir:'down',
       text:'the other six keep being delivered',color:'--ok'}],
    notes:[[7,'Same seven streams, same shared link, same bottleneck.'],
      [r.lostAt+1,'✗ — the identical loss, this time on hero.jpg.'],
      [r.lostAt+3,'Only that one row stalls. Every other stream is delivered untouched, because nothing else was waiting on those bytes to be in order.',1],
      [r.lostAt+9,'QUIC also folds TLS into the transport handshake: one round trip, or zero when resuming.']]};
}

const probe=muxJobs(), clean=simulate(probe), LT=probe[0].done+3;
const S=[h10(),h11(),par(),h2({tick:LT,stream:null}),h3({tick:LT,stream:2})];
S.push({proto:'Summary',title:'What each change actually bought',
  sub:'Time until the last byte reaches the page. Derived from the model above, not measured.',
  summary:[['HTTP/1.0','connection per request',S[0].fin,'--block'],
    ['HTTP/1.1','keep-alive, one line',S[1].fin,'#ef8354'],
    ['HTTP/1.1','six parallel connections',S[2].fin,'--rtx'],
    ['HTTP/2','multiplexed, no loss',clean.fin,'--s1'],
    ['HTTP/2','multiplexed, one loss',S[3].fin,'--s1'],
    ['HTTP/3','QUIC, the same loss',S[4].fin,'--s0']],
  takeaways:[['keep-alive','stopped paying a handshake per file'],
    ['6 connections','bought parallelism, at six times the setup and no extra bandwidth'],
    ['HTTP/2','many streams on one connection — no head-of-line blocking in HTTP'],
    ['HTTP/3 / QUIC','independent streams — none left in the transport either'],
    ['but note','under packet loss HTTP/2 can trail six HTTP/1.1 connections. That is precisely why QUIC was worth building.',1]],
  fin:54,notes:[],anno:[]});


/* ===================================================== presentation config
   These used to be hardcoded inside the player. They belong to the topic. */
const LABELS = { hs:'connecting', req:'requesting', wait:'server thinking',
                 resp:'receiving', block:'queued', stall:'stalled',
                 wire:'carrying', idle:'idle' };
const LEG = [['--hs','handshake'],['--req','request'],['--wait','server thinking']];
const LEG_PLAIN = LEG.concat([['--s1','bytes arriving'],['--block','blocked in the queue']]);
const LEG_WIRE  = LEG.concat([['--s0','bytes arriving'],['--block','blocked in the queue'],
                              ['--stall','stalled by loss'],['--lost','packet lost'],
                              ['--rtx','retransmit']]);
const STATS = [
  { label:'ms elapsed',       kind:'elapsed' },
  { label:'ms blocked',       kind:'sum',  of:['block','stall'],  tone:'bad'  },
  { label:'assets delivered', kind:'done', of:['resp','burst'],   tone:'good' }];

S.forEach(s => {
  s.tag = s.proto;
  if (!s.summary) s.legend = s.wire ? LEG_WIRE : LEG_PLAIN;
  if (s.wire) s.statLabels = [null, 'ms stalled', null];
});
S[2].drain = { total:30, per:6, everyTicks:4,
               label:'a real page: 30 assets, six at a time' };
S[5].foot  = 'Model, not measurement — 40 ms round trip, one shared bottleneck link at one '
           + 'packet per tick, seven assets, one lost packet in every run marked "one loss".';

/* --- matched-condition comparison -------------------------------------
   The original charted a LOSS-FREE six-connection run against a WITH-LOSS
   HTTP/2 run and concluded HTTP/2 trails. Run matched, they tie — so the
   comparison is rebuilt here and the claim is retired. */
(function () {
  const parJobs = () => { const idx=J(ASSETS[0],0,RTT), st=J(ASSETS[1],0,0,idx,idx);
    return [idx,st].concat(ASSETS.slice(2).map((a,k)=>J(a,k+1,RTT,null,idx))); };
  const parLoss = simulate(parJobs(), {tick:LT, stream:null});
  S[5].summary = [
    ['HTTP/1.0','connection per request',       S[0].fin,   '--block'],
    ['HTTP/1.1','keep-alive, one line',         S[1].fin,   '#ef8354'],
    ['HTTP/1.1','six connections, no loss',     S[2].fin,   '--rtx'],
    ['HTTP/2',  'multiplexed, no loss',         clean.fin,  '--s1'],
    ['HTTP/1.1','six connections, one loss',    parLoss.fin,'--rtx'],
    ['HTTP/2',  'multiplexed, one loss',        S[3].fin,   '--s1'],
    ['HTTP/3',  'QUIC, the same loss',          S[4].fin,   '--s0']];
  S[5].takeaways = [
    ['keep-alive',   'stopped paying a handshake per file'],
    ['6 connections','parallelism, at six times the setup and no extra bandwidth'],
    ['HTTP/2',       'many streams on one connection — no head-of-line blocking in HTTP'],
    ['HTTP/3',       'independent streams — none left in the transport either'],
    ['read this',    'under loss these finish within one tick of each other. At 20 ms per '
                   + 'tick this model cannot resolve the difference, so it is not evidence '
                   + 'either way — the real distinction is why QUIC exists, and this '
                   + 'artefact does not demonstrate it.', 1]];
})();

/* =============================================================== RENDER */
const SC=typeof PALETTE!=='undefined'?PALETTE:
  ['--s0','--s1','--s2','--s3','--s4','--s5','--s6'];
const LB=Object.assign({hs:'setting up',req:'requesting',wait:'waiting',resp:'working',
  block:'queued',stall:'stalled',wire:'carrying',idle:'idle'},
  typeof LABELS!=='undefined'?LABELS:{});
const LG=typeof LEGEND!=='undefined'?LEGEND:[['--hs','setup'],['--req','request'],
  ['--wait','waiting'],['--s1','working'],['--block','blocked']];
const ST=typeof STATS!=='undefined'?STATS:[{label:'elapsed',kind:'elapsed'}];
const LW=118,CW=13.2,LH=22,GAP=22,AXH=40,RW=132;
const VW=LW+TW*CW+RW;
const css=n=>String(n).startsWith('--')
  ? getComputedStyle(document.documentElement).getPropertyValue(n).trim() : n;
const X=t=>LW+t*CW, laneY=i=>AXH+i*(LH+GAP);
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');

function runs(cells){
  const out=[];let i=0;
  while(i<TW){ if(!cells[i]){i++;continue;}
    const k=cells[i].k,l=cells[i].lane,s=i;
    while(i<TW&&cells[i]&&cells[i].k===k&&cells[i].lane===l)i++;
    out.push({k,lane:l,s,n:i-s}); }
  return out;
}
function drawRuns(cells,y){
  let o='';
  for(const r of runs(cells)){
    const x=X(r.s), w=r.n*CW-1.7, c=r.lane!=null?css(SC[r.lane%7]):null;
    if(r.k==='hs') o+=`<rect x="${x}" y="${y+7}" width="${w}" height="${LH-14}" rx="3" fill="${css('--hs')}" opacity=".5"/>`;
    else if(r.k==='wait') o+=`<rect x="${x}" y="${y+LH/2-1}" width="${w}" height="2" rx="1" fill="${css('--wait')}"/>`;
    else if(r.k==='block') o+=`<rect x="${x}" y="${y+4}" width="${w}" height="${LH-8}" rx="3" fill="url(#hatch)"/>`;
    else if(r.k==='stall') o+=`<rect class="stall-r" x="${x}" y="${y+2}" width="${w}" height="${LH-4}" rx="4" fill="${css('--stall')}"/>`;
    else if(r.k==='resp'||r.k==='burst'||r.k==='pkt') o+=`<rect x="${x}" y="${y+2}" width="${w}" height="${LH-4}" rx="4" fill="${c}"/>`;
    else if(r.k==='held') o+=`<rect x="${x}" y="${y+2}" width="${w}" height="${LH-4}" rx="4" fill="${c}" opacity=".28"/>`;
    else if(r.k==='req') o+=`<path d="M${x+1} ${y+6} L${x+w} ${y+LH/2} L${x+1} ${y+LH-6} Z" fill="${css('--req')}"/>`;
    else if(r.k==='lost') o+=`<text class="glyph" x="${x+w/2}" y="${y+LH-6}" fill="${css('--lost')}">✗</text>`;
    else if(r.k==='rtx') o+=`<text class="glyph" x="${x+w/2}" y="${y+LH-6}" fill="${css('--rtx')}">↻</text>`;
  }
  return o;
}
function chartH(sc){
  return AXH+sc.lanes.length*(LH+GAP)+(sc.wire?LH+GAP+16:0)+14;
}
function buildChart(sc){
  const H=chartH(sc); let g='',ax='';
  for(let c=0;c<=TW;c+=8){
    ax+=`<text class="axl" x="${X(c)}" y="14">${c*TICK_MS}</text>`
      + `<line x1="${X(c)}" y1="19" x2="${X(c)}" y2="${H-8}" stroke="${css('--line')}"/>`;
  }
  ax+=`<text class="axl" x="${X(TW)+16}" y="14">ms</text>`;
  // hard start marker
  ax+=`<line x1="${LW}" y1="19" x2="${LW}" y2="${H-8}" stroke="${css('--line2')}" stroke-width="2"/>`
    + `<text class="axl" x="${LW-4}" y="${H-1}" text-anchor="end" fill="${css('--faint')}">START</text>`;
  sc.lanes.forEach(([name,cells],i)=>{
    const y=laneY(i);
    g+=`<rect x="${LW}" y="${y}" width="${TW*CW}" height="${LH}" rx="4" fill="${i%2?'#0e1319':'#111720'}"/>`;
    g+=`<text class="lbl" x="${LW-13}" y="${y+LH/2+4}" text-anchor="end">${esc(name)}</text>`;
    g+=`<g clip-path="url(#rev)">${drawRuns(cells,y)}</g>`;
  });
  if(sc.wire){
    const y=laneY(sc.lanes.length)+16;
    g+=`<line x1="${LW-90}" y1="${y-13}" x2="${X(TW)}" y2="${y-13}" stroke="${css('--line2')}"/>`;
    g+=`<rect x="${LW}" y="${y}" width="${TW*CW}" height="${LH}" rx="4" fill="#0e1319"/>`;
    g+=`<text class="lbl" x="${LW-13}" y="${y+LH/2+4}" text-anchor="end">${esc(sc.wire[0])}</text>`;
    g+=`<g clip-path="url(#rev)">${drawRuns(sc.wire[1],y)}</g>`;
  }
  return `<svg id="chart" viewBox="0 0 ${VW} ${H+14}">
    <defs>
      <clipPath id="rev"><rect id="revr" x="0" y="0" width="0" height="${H+14}"/></clipPath>
      <pattern id="hatch" width="5" height="5" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
        <rect width="5" height="5" fill="${css('--block')}" opacity=".15"/>
        <line x1="0" y1="0" x2="0" y2="5" stroke="${css('--block')}" stroke-width="2.3" opacity=".85"/>
      </pattern>
    </defs>
    <g id="annoBack"></g>${ax}${g}<g id="annoFront"></g>
    <line id="ph" x1="0" y1="19" x2="0" y2="${H-8}" stroke="${css('--req')}" stroke-width="1.2" opacity=".6"/>
    <g id="status"></g></svg>`;
}

/* ---- live annotations, redrawn each frame ---- */
function label(x,y,text,color,anchor){
  const w=text.length*5.75+13, ax=anchor==='end'?x-w:anchor==='middle'?x-w/2:x;
  const cx=Math.max(4,Math.min(ax,VW-w-4));
  return `<rect x="${cx}" y="${y-11}" width="${w}" height="17" rx="4.5"
    fill="#0b0e12" stroke="${color}" stroke-opacity=".55"/>
    <text class="anl" x="${cx+w/2}" y="${y+1.5}" text-anchor="middle" fill="${color}">${esc(text)}</text>`;
}
function annos(sc,T){
  let back='',front='';
  for(const a of (sc.anno||[])){
    if(a.at==null||T<a.at)continue;
    if(a.until!=null&&T>=a.until)continue;
    const col=css(a.color==='--wait2'?'--faint':a.color||'--faint');
    if(a.kind==='band'){
      const to=Math.min(a.to,T), from=a.from;
      if(to<=from)continue;
      const y0=laneY(0)-6, y1=laneY(sc.lanes.length-1)+LH+6;
      back+=`<rect x="${X(from)}" y="${y0}" width="${(to-from)*CW}" height="${y1-y0}"
        fill="${col}" opacity=".07"/>
        <line x1="${X(from)}" y1="${y0}" x2="${X(from)}" y2="${y1}" stroke="${col}"
          stroke-opacity=".5" stroke-dasharray="3 3"/>
        <line x1="${X(to)}" y1="${y0}" x2="${X(to)}" y2="${y1}" stroke="${col}"
          stroke-opacity=".5" stroke-dasharray="3 3"/>`;
      const bms=a.live?` — ${Math.round((to-from)*TICK_MS)} ms`:'';
      front+=label(X((from+to)/2),y0-7,a.text+bms,col,'middle');
    }else if(a.kind==='span'){
      const to=a.live?Math.min(a.to,T):a.to, from=a.from;
      if(to<=from)continue;
      const y=laneY(a.lane)+LH+3.5, x0=X(from), x1=X(to);
      front+=`<path d="M${x0} ${y-3.5} L${x0} ${y} L${x1} ${y} L${x1} ${y-3.5}"
        fill="none" stroke="${col}" stroke-width="1.3" stroke-opacity=".85"/>`;
      const ms=Math.round((to-from)*TICK_MS);
      front+=label((x0+x1)/2,laneY(a.lane)+LH+14,`${a.text} — ${ms} ms`,col,'middle');
    }else if(a.kind==='point'){
      const y=a.wire?laneY(sc.lanes.length)+16:laneY(a.lane);
      const up=a.dir==='up', ax=X(a.tick)+CW/2, dy=up?y:y+LH;
      front+=`<line x1="${ax}" y1="${dy}" x2="${ax}" y2="${dy+(up?-4:4)}"
        stroke="${col}" stroke-width="1.2" stroke-opacity=".8"/>
        <circle cx="${ax}" cy="${dy}" r="2.4" fill="${col}"/>`;
      front+=label(ax,up?y-9:y+LH+14,a.text,col,'middle');
    }
  }
  return [back,front];
}
/* ---- per-lane live status column ---- */
function statusCol(sc,T){
  let o='';
  const rows=sc.lanes.concat(sc.wire?[[null,sc.wire[1]]]:[]);
  rows.forEach(([name,cells],i)=>{
    const y=(name===null?laneY(sc.lanes.length)+16:laneY(i))+LH/2+4;
    const c=T>0?cells[Math.min(T,TW)-1]:null;
    let txt='—',col=css('--dim');
    const doneAt=(()=>{for(let k=TW-1;k>=0;k--)if(cells[k]&&/resp|burst|pkt/.test(cells[k].k))return k+1;return -1;})();
    if(name===null){ txt=T>0&&c?LB.wire:LB.idle; }
    else if(doneAt>0&&T>=doneAt){ txt='✓ '+doneAt*TICK_MS+' ms'; col=css('--ok'); }
    else if(!c) txt='—';
    else if(c.k==='block'){ let n=0;for(let k=Math.min(T,TW)-1;k>=0&&cells[k]&&cells[k].k==='block';k--)n++;
      txt=LB.block+' '+n*TICK_MS+' ms'; col=css('--block'); }
    else if(c.k==='stall'){ let n=0;for(let k=Math.min(T,TW)-1;k>=0&&cells[k]&&cells[k].k==='stall';k--)n++;
      txt=LB.stall.toUpperCase()+' '+n*TICK_MS+' ms'; col=css('--stall'); }
    else if(c.k==='hs'){ txt=LB.hs; col=css('--hs'); }
    else if(c.k==='req'){ txt=LB.req; col=css('--req'); }
    else if(c.k==='wait'){ txt=LB.wait; col=css('--faint'); }
    else { txt=LB.resp; col=css(SC[(c.lane||0)%7]); }
    o+=`<text class="st" x="${X(TW)+14}" y="${y}" fill="${col}">${esc(txt)}</text>`;
  });
  return o;
}

/* =============================================================== DRIVER */
const $=id=>document.getElementById(id);
const PRESETS=[0.05,0.1,0.25,0.5,1,2,4], SPD_MIN=0.05, SPD_MAX=8;
let si=0,t=0,playing=true,speed=0.25,hold=0,last=0;
const fmtSpd=s=>(s<1?+s.toFixed(2):+s.toFixed(1))+'×';
function setSpeed(v,fromSlider){
  speed=Math.max(SPD_MIN,Math.min(SPD_MAX,v));
  $('spdv').innerHTML=`${fmtSpd(speed)} <i>${Math.round(TICK_MS/speed)} ms/frame</i>`;
  if(!fromSlider)$('spd').value=Math.round(Math.log2(speed)*100);
  [...$('presets').children].forEach(b=>
    b.classList.toggle('on',Math.abs(+b.dataset.s-speed)<1e-9));
}
$('tot').textContent=S.length;
$('dots').innerHTML=S.map(()=>'<div class="dot"><i></i></div>').join('');
[...$('dots').children].forEach((d,i)=>d.onclick=()=>go(i));
$('stats').innerHTML=ST.map((s,i)=>
  `<div class="stat ${s.tone||''}"><b id="sv${i}">0</b><span id="sl${i}">${s.label}</span></div>`).join('');

function mount(){
  const sc=S[si];
  $('chip').textContent=sc.tag; $('title').innerHTML=sc.title;
  $('sub').textContent=sc.sub; $('scn').textContent=si+1;
  [...$('dots').children].forEach((d,i)=>{d.classList.toggle('done',i<si);
    if(i!==si)d.querySelector('i').style.width=i<si?'100%':'0';});
  const sum=!!sc.summary;
  $('panel').style.display=sum?'none':''; $('summary').style.display=sum?'':'none';
  $('stats').style.display=sum?'none':'flex';
  $('prev').disabled=si===0; $('next').disabled=si===S.length-1;
  $('legend').style.display=sum?'none':'flex';
  $('legend').innerHTML=sum?'':'<h4>reading the chart</h4>'
    +(sc.legend||LG).map(([c,l])=>`<span><b style="background:${css(c)}"></b>${l}</span>`).join('');
  if(sum){
    $('summary').innerHTML=sc.summary.map(([n,d,f,c])=>
      `<div class="row"><div class="nm">${n}<i>${d}</i></div>
       <div class="track"><i style="background:${css(c)}"></i></div><div class="ms">—</div></div>`).join('')
      +`<div class="takeaways">`+sc.takeaways.map(([k,v,w])=>
        `<div class="tk${w?' warn':''}"><b>${k}</b><span>${v}</span></div>`).join('')
      +(sc.foot?`</div><div class="foot">${esc(sc.foot)}</div>`:'</div>');
  }else{
    $('chartcol').innerHTML=buildChart(sc)+'<div id="drain"></div>';
    if(sc.drain){ $('drain').style.display='block';
      $('drain').innerHTML='<div class="cells">'+
        Array.from({length:sc.drain.total},()=>'<i></i>').join('')+'</div><span id="dtxt"></span>'; }
  }
  $('notes').innerHTML=(sc.notes||[]).map(([,txt,key])=>
    `<div class="note${key?' key':''}">${esc(txt)}</div>`).join('');
  ST.forEach((s,i)=>{const e=$('sl'+i); if(e)e.textContent=(sc.statLabels&&sc.statLabels[i])||s.label;});
  $('panel').classList.add('swap');
  requestAnimationFrame(()=>$('panel').classList.remove('swap'));
  paint();
}
function paint(){
  const sc=S[si],T=Math.max(0,Math.min(t,TW));
  if(!sc.summary){
    const r=$('revr'),p=$('ph');
    if(r){r.setAttribute('x',LW);r.setAttribute('width',Math.max(0,T*CW));}
    if(p){const x=X(Math.min(T,TW));p.setAttribute('x1',x);p.setAttribute('x2',x);
      p.style.opacity=T>=sc.fin?0:.6;}
    const [b,f]=annos(sc,T);
    $('annoBack').innerHTML=b; $('annoFront').innerHTML=f;
    $('status').innerHTML=statusCol(sc,T);
    ST.forEach((s,i)=>{
      const e=$('sv'+i); if(!e)return;
      if(s.kind==='elapsed'){ e.textContent=Math.min(T,sc.fin)*TICK_MS; }
      else if(s.kind==='sum'){ let n=0;
        for(const [,cells] of sc.lanes) for(let k=0;k<T;k++)
          if(cells[k]&&s.of.includes(cells[k].k))n++;
        e.textContent=n*TICK_MS; }
      else if(s.kind==='done'){ let d=0;
        for(const [,cells] of sc.lanes){ let f=-1;
          for(let k=TW-1;k>=0;k--) if(cells[k]&&(s.of||['resp','burst']).includes(cells[k].k)){f=k+1;break;}
          if(f>0&&T>=f)d++; }
        e.textContent=d+' / '+sc.lanes.length; }
    });
    if(sc.drain){
      const {total,per,everyTicks}=sc.drain;
      const done=Math.min(total,Math.max(0,Math.floor((T-6)/everyTicks))*per),
            fly=done<total?Math.min(per,total-done):0;
      [...$('drain').querySelectorAll('i')].forEach((e,i)=>
        e.className=i<done?'d':i<done+fly?'f':'');
      const d=$('dtxt'); if(d)d.textContent=
        `${sc.drain.label} — ${done} done · ${fly} in flight · ${sc.drain.total-done-fly} queued`;
    }
  }else{
    const mx=Math.max(...sc.summary.map(r=>r[2]));
    [...$('summary').querySelectorAll('.row')].forEach((row,i)=>{
      const g=Math.max(0,Math.min(1,(T-4-i*3)/9)), ms=sc.summary[i][2]*TICK_MS;
      row.querySelector('.track i').style.width=(g*sc.summary[i][2]/mx*100)+'%';
      row.querySelector('.ms').textContent=g>0?Math.round(ms*g)+' ms':'—';
    });
    [...$('summary').querySelectorAll('.tk')].forEach((e,i)=>e.classList.toggle('on',T>32+i*3));
  }
  [...$('notes').children].forEach((n,i)=>n.classList.toggle('on',T>=sc.notes[i][0]));
  $('dots').children[si].querySelector('i').style.width=Math.min(100,T/sc.fin*100)+'%';
  $('scrub').value=Math.min(100,T/sc.fin*100);
}
function go(n){ si=Math.max(0,Math.min(S.length-1,n)); t=0; hold=0; mount(); }
function setPlay(v){ playing=v; $('play').textContent=v?'pause':'play'; }
function step(d){ setPlay(false); t=Math.max(0,Math.min(TW,t+d)); hold=0; paint(); }

function loop(ts){
  if(playing&&ts-last>TICK_MS/speed){
    last=ts;
    if(t<=S[si].fin+2)t++;
    else if(++hold>Math.max(3,Math.round(110*speed))){   // ~2.2 s of wall clock, any speed
      if(si<S.length-1)go(si+1); else { setPlay(false); $('play').textContent='replay'; }
    }
    paint();
  }
  requestAnimationFrame(loop);
}
$('play').onclick=()=>{ if(!playing&&t>S[si].fin){t=0;hold=0;} setPlay(!playing); };
$('rall').onclick=()=>{ si=0; t=0; hold=0; setPlay(true); mount(); };
$('rscene').onclick=()=>{ t=0; hold=0; setPlay(true); paint(); };
$('prev').onclick=()=>go(si-1);
$('next').onclick=()=>go(si+1);
$('spd').oninput=e=>setSpeed(Math.pow(2,+e.target.value/100),true);
$('presets').innerHTML=PRESETS.map(v=>`<button data-s="${v}">${v}×</button>`).join('');
[...$('presets').children].forEach(b=>b.onclick=()=>setSpeed(+b.dataset.s));
$('scrub').oninput=e=>{ setPlay(false); t=Math.round(e.target.value/100*S[si].fin); hold=0; paint(); };
addEventListener('keydown',e=>{
  const k=e.key;
  if(k===' '||k==='k'){ e.preventDefault(); $('play').click(); }
  else if(k==='ArrowRight'){ e.preventDefault(); step(1); }
  else if(k==='ArrowLeft'){ e.preventDefault(); step(-1); }
  else if(k===']'){ go(si+1); } else if(k==='['){ go(si-1); }
  else if(k==='l'){ setSpeed(speed*Math.pow(2,e.shiftKey?1:0.25)); }
  else if(k==='j'){ setSpeed(speed/Math.pow(2,e.shiftKey?1:0.25)); }
  else if(k==='R'){ $('rall').click(); }
  else if(k==='r'){ $('rscene').click(); }
  else if(k==='0'||k==='Home'){ t=0; hold=0; setPlay(false); paint(); }
});
setSpeed(speed);
mount(); requestAnimationFrame(loop);
</script></body></html>
