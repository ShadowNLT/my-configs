<div class="mod-proof-steps" data-diagram-module="proof-steps">
  <style>
    .mod-proof-steps { overflow-x: auto; max-width: 100%; }
    .mod-proof-steps table { border-collapse: collapse; width: 100%; min-width: 18rem; }
    .mod-proof-steps th, .mod-proof-steps td { border: 1px solid #1c1c1c; padding: 0.4rem 0.55rem; vertical-align: top; }
    .mod-proof-steps thead th { background: #215c45; color: #fff; }
    .mod-proof-steps .n { width: 2rem; text-align: right; font-variant-numeric: tabular-nums; }
    .mod-proof-steps .just { width: 42%; color: #5c574e; }
    .mod-proof-steps caption { caption-side: bottom; text-align: left; font-size: 0.8rem; color: #5c574e; padding-top: 0.35rem; }
  </style>
  <table>
    <caption>Each statement names its justification. No orphan claims.</caption>
    <thead>
      <tr>
        <th class="n" scope="col">#</th>
        <th scope="col">Statement</th>
        <th class="just" scope="col">Justification</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td class="n">1</td>
        <td>{{S1}}</td>
        <td class="just">{{J1}}</td>
      </tr>
      <tr>
        <td class="n">2</td>
        <td>{{S2}}</td>
        <td class="just">{{J2}}</td>
      </tr>
      <tr>
        <td class="n">3</td>
        <td>{{S3}}</td>
        <td class="just">{{J3}}</td>
      </tr>
    </tbody>
  </table>
</div>
