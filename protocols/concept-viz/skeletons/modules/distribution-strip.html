<div class="mod-distribution-strip" data-diagram-module="distribution-strip">
  <style>
    .mod-distribution-strip { max-width: 100%; }
    .mod-distribution-strip .plot { display: grid; grid-template-columns: repeat(6, 1fr); align-items: end; min-height: 7rem; gap: 0.2rem; border-bottom: 2px solid #1c1c1c; padding: 0 0.2rem; }
    .mod-distribution-strip .col { display: flex; flex-direction: column-reverse; align-items: center; gap: 0.15rem; min-height: 6rem; }
    .mod-distribution-strip .dot { width: 0.85rem; height: 0.85rem; border-radius: 50%; background: #215c45; }
    .mod-distribution-strip .ticks { display: grid; grid-template-columns: repeat(6, 1fr); font-size: 0.8rem; color: #5c574e; text-align: center; margin-top: 0.25rem; }
    .mod-distribution-strip .box { display: grid; grid-template-columns: 16.6% 16.6% 33.4% 16.7% 16.7%; align-items: center; margin-top: 0.55rem; font-size: 0.75rem; color: #5c574e; }
    .mod-distribution-strip .whisk { border-top: 2px solid #1c1c1c; }
    .mod-distribution-strip .hinge { height: 1.1rem; border: 2px solid #215c45; background: #e8f2ed; text-align: center; line-height: 1.1rem; }
    @media (max-width: 40rem) {
      .mod-distribution-strip .dot { width: 0.7rem; height: 0.7rem; }
    }
  </style>
  <div class="plot" role="img" aria-label="dot plot on a common scale">
    <div class="col"><span class="dot"></span></div>
    <div class="col"><span class="dot"></span><span class="dot"></span></div>
    <div class="col"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
    <div class="col"><span class="dot"></span><span class="dot"></span></div>
    <div class="col"><span class="dot"></span></div>
    <div class="col"></div>
  </div>
  <div class="ticks">
    <span>{{T1}}</span><span>{{T2}}</span><span>{{T3}}</span><span>{{T4}}</span><span>{{T5}}</span><span>{{T6}}</span>
  </div>
  <div class="box" aria-label="box summary on the same scale">
    <div class="whisk"></div>
    <div class="hinge">{{Q1}}</div>
    <div class="hinge">{{MED}}</div>
    <div class="hinge">{{Q3}}</div>
    <div class="whisk"></div>
  </div>
</div>
